name: Import chunked avatars

on:
  push:
    branches: [main]
    paths:
      - tmp/avatar-chunks/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p public/avatars
          for scene in voice event video catsoft legalops lawlib foia contract rim oralhist claims grant; do
            parts=(tmp/avatar-chunks/${scene}.p*)
            if [ ${#parts[@]} -eq 0 ]; then
              echo "missing parts for ${scene}"
              exit 1
            fi
            cat "${parts[@]}" > "/tmp/${scene}.b64"
            base64 -d "/tmp/${scene}.b64" > "public/avatars/${scene}.png"
            file "public/avatars/${scene}.png" | grep -q PNG
          done
          rm -rf tmp/avatar-chunks
      - name: Commit portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/*.png
          git add -u tmp/avatar-chunks || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Add New matters role avatars"
          git push
