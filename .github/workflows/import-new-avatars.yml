name: Import new avatars

on:
  push:
    branches: [main]
    paths:
      - tmp/new-avatars/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode portraits
        run: |
          set -euo pipefail
          mkdir -p public/avatars
          for f in tmp/new-avatars/*.b64; do
            name=$(basename "$f" .b64)
            base64 -d "$f" > "public/avatars/${name}.png"
            file "public/avatars/${name}.png" | grep -q PNG
          done
          rm -rf tmp/new-avatars
      - name: Commit portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/*.png
          git add -u tmp/new-avatars || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Add New matters role avatars"
          git push
