name: Import new avatars

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-new-avatars.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download New matters portraits
        run: |
          set -euo pipefail
          mkdir -p public/avatars
          base="https://new-avatars--laylimajnunmustgo.netlify.app/avatars"
          for name in voice event video catsoft legalops lawlib foia contract rim oralhist claims grant; do
            echo "fetch $name"
            curl -fsSL "$base/$name.png" -o "public/avatars/${name}.png"
            file "public/avatars/${name}.png" | grep -q PNG
          done
      - name: Commit portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/avatars/*.png
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Add New matters role avatars"
          git push
